name: Build PixelHavenCore

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # 第一阶段：构建与打包
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          cache: "gradle"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure Git User
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Github Actions"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build PixelHavenCore jar
        run: ./gradlew build --no-daemon

      - name: Collect jars
        run: |
          mkdir -p release
          cp build/libs/*.jar release/ || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelHavenCore-Build
          path: release/*.jar
          retention-days: 7

  # 第二阶段：自动发布
  release:
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: PixelHavenCore-Build
          path: release/

      - name: Auto Increment Version
        id: get_version
        run: |
          # 获取所有已发布的 tag，筛选 1.0.x 格式的版本号
          git fetch --tags
          LATEST_TAG=$(git tag -l "v1.0.*" | sort -V | tail -n 1)
          
          if [ -z "$LATEST_TAG" ]; then
            # 如果没有 1.0.x 的 tag，从 1.0.0 开始
            NEW_VERSION="1.0.0"
            echo "No existing 1.0.x tags found, starting from 1.0.0"
          else
            # 提取 x 并加 1
            CURRENT_X=$(echo "$LATEST_TAG" | sed 's/v1.0.//')
            NEXT_X=$((CURRENT_X + 1))
            NEW_VERSION="1.0.${NEXT_X}"
            echo "Latest tag: $LATEST_TAG, next version: $NEW_VERSION"
          fi
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git tag ${{ steps.get_version.outputs.tag }}
          git push origin ${{ steps.get_version.outputs.tag }}

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.get_version.outputs.tag }}
          name: PixelHavenCore ${{ steps.get_version.outputs.version }}
          body: |
            This release is automatically compiled by GitHub Actions.
            ### Version
            `${{ steps.get_version.outputs.version }}`
            ### Commit Message
            ${{ github.event.head_commit.message }}
          artifacts: release/*.jar
          generateReleaseNotes: true
          prerelease: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
