name: Build PixelHavenCore

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # 第一阶段：构建与打包
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          cache: "gradle"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure Git User
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Github Actions"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build PixelHavenCore jar
        run: ./gradlew build --no-daemon

      - name: Collect jars
        run: |
          mkdir -p release
          cp build/libs/*.jar release/ || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelHavenCore-Build
          path: release/*.jar
          retention-days: 7

  # 第二阶段：自动发布（仅在推送 v* 标签时触发）
  release:
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: PixelHavenCore-Build
          path: release/

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected Version: $VERSION"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: PixelHavenCore ${{ steps.get_version.outputs.version }}
          body: |
            This release is automatically compiled by GitHub Actions.
            ### Commit Message
            ${{ github.event.head_commit.message }}
          artifacts: release/*.jar
          generateReleaseNotes: true
          prerelease: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
