# =============================================================================
# protection — 实体保护配置
# 控制苦力怕爆炸保护和传送门实体防护行为
# =============================================================================

version: 1

creeperProtect:
  enabled: false                           # 功能开关（true = 启用，false = 禁用）
  cancelDamage: false

portalProtection:
  enabled: true                            # 功能开关（true = 启用，false = 禁用）
  blockedEntities:
    - FROG
  clearInNetherEnd: true
  clearEntitiesInNetherEnd:
    - FROG
