version: 1

# =============================================================================
# 称号系统配置
# =============================================================================
# 功能说明：
#   - 称号获取、装备、管理
#   - 支持分类、稀有度、有效期
#   - GUI 界面操作

# 功能开关（true = 启用，false = 禁用）
enabled: true

# PlaceholderAPI 配置
papi:
  enabled: true

# GUI 配置
gui:
  title: "<gradient:gold:yellow>称号系统</gradient>"
  rows: 6
  # 边框材质
  border-item: "GRAY_STAINED_GLASS_PANE"
  # 深色边框（顶部/底部行）
  border-accent: "BLACK_STAINED_GLASS_PANE"
  # 分类网格槽位（含 all）
  category-slots:
    - 7
    - 17
    - 26
    - 35
    - 44
  # 称号展示起始槽位
  title-start-slot: 10
  # 每页称号数量
  page-size: 28
  # 导航按钮
  prev-page-slot: 48
  info-slot: 49
  next-page-slot: 50
  # 已装备标识
  active-indicator: "LIME_STAINED_GLASS_PANE"
  # 已过期标识
  expired-indicator: "RED_STAINED_GLASS_PANE"
  # 可用标识
  available-indicator: "WHITE_STAINED_GLASS_PANE"
  # 未拥有标识
  locked-indicator: "ORANGE_STAINED_GLASS_PANE"
  # 稀有度颜色
  rarity-colors:
    common: "&7"
    uncommon: "&a"
    rare: "&9"
    epic: "&5"
    legendary: "&6"

# 玩家默认称号（首次进入时自动发放并装备）
default-title:
  enabled: false
  # 称号ID，需与 titles/*.yml 中定义的 ID 一致
  title-id: "new_player"
  # 是否自动装备该称号
  auto-equip: true

# 自动过期清理
expiry:
  check-interval-ticks: 6000

# 消息
messages:
  title-activated: "&a已装备称号: {title}"
  title-deactivated: "&e已卸下称号。"
  title-not-owned: "&c你尚未拥有该称号。"
  title-expired: "&c该称号已过期。"
  title-no-permission: "&c你没有使用该称号的权限。"
  title-given: "&a已发放称号 &f{title} &a给 &f{player}&a。"
  title-removed: "&a已移除玩家 &f{player} &a的称号 &f{title}&a。"
  reload-success: "&a称号配置已重载。"
  no-title-active: "&7无称号"
  gui-no-titles: "&7暂无可用称号"
  gui-page-info: "&7第 {current}/{total} 页"
  # GUI 内部文本
  gui-category-all: "全部"
  gui-category-filter: "&7点击筛选"
  gui-category-current: "&7当前筛选"
  gui-prev-page: "&e上一页"
  gui-next-page: "&e下一页"
  gui-equipped: "&a✔ 已装备"
  gui-click-unequip: "&7点击卸下称号"
  gui-expired: "&c✘ 已过期"
  gui-available: "&e可装备"
  gui-click-equip: "&7点击装备称号"
  gui-permanent: "&7有效期: &a永久"
  gui-not-owned: "&c✘ 未拥有"
  gui-title-system: "&6称号系统"
  gui-owned: "&7已拥有: &f{count}"
  gui-total: "&7总称号: &f{count}"
  gui-category: "&7分类: &f{category}"
  gui-rarity: "&7稀有度: &f{rarity}"
  gui-remaining: "&7剩余时间: &f{time}"
