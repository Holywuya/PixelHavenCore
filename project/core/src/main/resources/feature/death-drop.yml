version: 4

# =============================================================================
# Death Drop — 每日有限次数死亡不掉落保护
# 玩家在指定世界死亡时，每天拥有固定次数的"死亡不掉落"保护。
# 次数用完后，物品正常掉落。
# =============================================================================

# 功能开关（true = 启用，false = 禁用）
enabled: true

# 生效世界
worlds:
  - world_the_end
  - world_nether

# 每日死亡不掉落次数（默认次数，无权限组匹配时使用）
daily-keep-count: 3

# 权限组次数配置（从上到下匹配第一个拥有的权限；都不匹配则使用 daily-keep-count）
# 注意：拥有多个权限时以列表靠前的为准
permission-groups:
  - permission: "phcore.deathdrop.vip"
    count: 5
  - permission: "phcore.deathdrop.mvp"
    count: 10

# 拥有此权限的玩家不受限制
exempt-permission: "phcore.deathdrop.exempt"

# 保留次数时提示
# {consume} 本次消耗次数（固定为 1）
# {left}  今日剩余次数
# {used}  今日已使用次数
# {total} 每日总次数
keep-message: "&a本次死亡不掉落，已消耗 &f{consume}&a 次保护，今日剩余：&f{left}&a/&f{total}"

# 保护耗尽时提示
out-of-protection-message: "&c今日死亡保护次数已用尽，物品正常掉落。"
