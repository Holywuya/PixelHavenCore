version: 3

# =============================================================================
# 自定义工作台模块配置
# =============================================================================
# 功能说明：
#   - 提供自定义工作台系统，支持多等级工作台
#   - 支持排队制作、离线制作、自动领取
#   - 支持专业系统（如医疗专业减少制作时间）
#   - 支持 CraftEngine 自定义方块集成

# 基础设置
settings:
  # 总开关（true=启用，false=禁用）
  enabled: true
  # 语言设置（支持多语言）
  language: "zh_CN"
  # 调试模式（true=启用，false=禁用）
  debug: false

# CraftEngine 自定义方块与工作台等级映射
# 将 CraftEngine 的自定义方块绑定到工作台等级
craftengine_blocks:
  # 木制工作台（T1 等级）
  "craftengine:wooden_crafting_bench":
    tier: "T1"
  # 铁制工作台（T2 等级）
  "craftengine:iron_crafting_bench":
    tier: "T2"

# 工作台等级配置
bench_tiers:
  # T1 等级（木制工作台）
  T1:
    # 显示名称
    display_name: "木制工作台"
    # 制作速度倍率（1.0 = 正常速度，0.8 = 快 20%）
    speed_modifier: 1.0
    # 使用权限（为空字符串 "" 则不限制）
    use_permission: ""
  # T2 等级（铁制工作台）
  T2:
    display_name: "铁制工作台"
    # 0.8 表示制作速度比正常快 20%
    speed_modifier: 0.8
    # 需要此权限才能使用
    use_permission: "craft.bench.tier2"

# 专业系统配置
specializations:
  # 医疗专业
  medic:
    # 专业权限
    permission: "craft.specialization.medic"
    # 制作时间减少比例（0.3 = 减少 30%）
    time_reduction: 0.3
    # 适用于哪些配方分类
    applies_to:
      - "医疗"

# 排队制作配置
queue:
  # 是否允许离线制作（true=允许，false=不允许）
  allow_offline_crafting: true
  # 玩家上线时是否自动领取完成的物品（true=自动领取，false=不自动领取）
  auto_claim_online: true
  # 背包满时的处理方式（drop=掉落在地上，cancel=取消制作）
  full_inventory_action: "drop"
  # 取消制作时的退款比例（范围: 0.0-1.0）
  # 0.7 表示退还 70% 的材料
  cancel_refund_ratio: 0.7
  # 默认最大队列长度
  default_max_queue_size: 3
  # 基于权限的队列长度限制
  permission_limits:
    # VIP 玩家
    vip:
      # 所需权限
      permission: "craft.queue.vip"
      # 最大队列长度
      max_queue_size: 5
      # 优先级（数值越大优先级越高）
      priority: 20
    # 管理员
    admin:
      permission: "phcore.admin"
      max_queue_size: 10
      priority: 100

# GUI 界面配置
gui:
  # 边框材质
  border_item: "GRAY_STAINED_GLASS_PANE"
  # 深色边框材质（顶部/底部行）
  border_accent: "BLACK_STAINED_GLASS_PANE"
  # 分类网格槽位（含"全部"分类）
  category_slots: [7, 17, 26, 35, 44]
  # 配方展示起始槽位
  recipe_start_slot: 10
  # 每页配方数量
  page_size: 28
  # 上一页按钮槽位
  prev_page_slot: 52
  # 下一页按钮槽位
  next_page_slot: 53
  # 信息展示槽位
  info_slot: 50
  # 制作队列起始槽位
  queue_start_slot: 46
  # 制作队列最大显示数量
  queue_max: 4
