# =============================================================================
# 配方定义文件示例：绷带
# =============================================================================
# 功能说明：
#   - 定义自定义工作台的制作配方
#   - 支持多种材料组合和制作条件
#   - 可设置制作时间、经验值和解锁权限

# 配方唯一标识符（必须唯一，用于命令和API）
id: "bandage"

# 配方显示名称（支持颜色代码和 MiniMessage 格式）
display_name: "绷带"

# 配方分类（用于 GUI 分类筛选）
category: "医疗"

# 所需工作台最低等级（T1/T2 等）
required_bench_tier: "T1"

# 制作材料列表
# 每个材料需要指定物品类型和数量
materials:
  # 第一种材料：纸 x2
  - item: "PAPER"
    amount: 2
  # 第二种材料：白色羊毛 x1
  - item: "WHITE_WOOL"
    amount: 1

# 制作结果列表
# 支持多物品产出
results:
  # 产出：纸 x2（可制作消耗品或任务物品）
  - item: "PAPER"
    amount: 2

# 制作时间（单位：秒）
craft_time_seconds: 8

# 制作获得的经验值
experience: 5

# 解锁此配方所需的权限（为空字符串 "" 则无需权限）
unlock_permission: "craft.recipe.bandage"
