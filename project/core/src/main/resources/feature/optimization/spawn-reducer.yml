version: 2

# =============================================================================
# 自然生成削减模块配置
# =============================================================================
# 功能说明：
#   - 拦截指定百分比的自然生物生成，减少服务器实体数量
#   - 仅影响自然生成，不影响刷怪笼、生成蛋、命令等
#   - 支持多世界配置
#   - 有效降低服务器性能消耗

# 总开关（true=启用，false=禁用）
enabled: true

# 生效世界列表
# 空列表 = 所有世界生效
# 非空列表 = 仅列表中的世界生效
# 默认包含三个标准维度世界，可根据需要增删
enabled-world:
  - world
  - world_the_end
  - world_nether

# 自然生成削减百分比（范围: 0-100）
# 例如: 90 表示拦截 90% 的自然生成，只允许 10% 通过
# 设为 0 则不削减，设为 100 则完全禁止自然生成
reduction-percent: 90

# 被视为"自然生成"的 SpawnReason 列表（大小写不敏感）
# 仅这些原因会被削减，其他原因（如生成蛋、命令、刷怪笼等）不受影响
# 可选值: NATURAL, CHUNK_GEN, VILLAGE_DEFENSE, VILLAGE_INVASION 等
natural-reasons:
  - NATURAL
  - CHUNK_GEN
