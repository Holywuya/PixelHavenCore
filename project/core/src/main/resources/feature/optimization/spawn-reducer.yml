version: 2

# 总开关
enabled: true

# 生效世界列表（空列表 = 全部世界生效，非空列表 = 仅列表中的世界生效）
# 默认包含三个标准维度世界，可根据需要增删
enabled-world:
  - world
  - world_the_end
  - world_nether

# 自然生成削减百分比（0-100）
# 例如 90 表示拦截 90% 的自然生成
reduction-percent: 90

# 被视为“自然生成”的 SpawnReason 列表（大小写不敏感）
# 仅这些原因会被削减，生成蛋/命令/刷怪笼等不在这里，默认不受影响
natural-reasons:
  - NATURAL
  - CHUNK_GEN
