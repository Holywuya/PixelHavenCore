version: 7

# =============================================================================
# 实体清理模块配置
# =============================================================================
# 功能说明：
#   - 定期清理服务器中的多余实体以优化性能
#   - 支持清理掉落物和生物
#   - 提供清理倒计时提示和完成汇总
#   - 可配置清理周期和过滤条件

# 总开关（true=启用，false=禁用）
enabled: true

# 全量清理周期（单位：秒）
# 默认 1200 秒 = 20 分钟
scan-interval-seconds: 1200

# 清理前倒计时提示秒数列表
# 在清理前指定秒数时发送 ACTIONBAR 提示
# 例如: [10, 5] 表示在清理前 10 秒和 5 秒时各提示一次
countdown-seconds:
  - 10
  - 5

# 倒计时提示消息格式
# 占位符: {seconds} - 距离清理的剩余秒数
countdown-message: "&e[实体清理] &7将在 &f{seconds} &7秒后执行清理。"

# 清理完成汇总消息格式
# 占位符: {count} - 本次清理的实体总数
cycle-summary-message: "&a[实体清理] &7本轮清理完成，共清理 &f{count} &7个实体。"

# 掉落物清理配置
items:
  # 是否启用掉落物清理（true=启用，false=禁用）
  enabled: true
  # 掉落物最少存活时间（单位：秒）
  # 低于此时间的掉落物不会被清理，防止刚掉落的高价值物品被误清
  # 设为 0 则禁用时间过滤（与旧版行为一致）
  age-seconds: 25

# 生物清理配置
mobs:
  # 是否启用生物清理（true=启用，false=禁用）
  enabled: true
