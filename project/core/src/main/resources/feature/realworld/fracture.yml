# =============================================================================
# 骨折系统配置
# =============================================================================
# 高处坠落会导致骨折，影响移动速度
# 骨折值范围：0-100
# 恢复方式：自然恢复或使用治疗物品（绷带/石膏）

# 是否启用骨折系统
enabled: true

# 坠落伤害阈值：低于此值的坠落不会导致骨折
# 原版 Minecraft 中，3 格高度坠落造成 1 点伤害（0.5 心）
# 默认值 4.0 相当于从 6 格高度坠落
min-fall-damage: 4.0

# 伤害转换为骨折值的倍率
# 公式：骨折值增加 = (坠落伤害 - 阈值) * 倍率
# 例如：10 点伤害，阈值 4，倍率 5 → 增加 30 点骨折值
damage-multiplier: 5.0

# 自然恢复速率（每分钟恢复的骨折值）
# 中度及以上骨折时，恢复速率减半
recovery-rate: 2.0

# 绷带治疗的骨折值
bandage-heal-amount: 30.0

# 绷带材料（用于制作治疗物品）
bandage-material: PAPER

# 石膏材料（完全治愈）
cast-material: CLAY_BALL

# 骨折等级阈值
thresholds:
  # 轻微骨折：移动速度降低 20%
  mild: 20.0
  # 中度骨折：移动速度降低 50%，禁止疾跑
  moderate: 50.0
  # 严重骨折：移动速度降低 80%，禁止疾跑
  severe: 80.0
