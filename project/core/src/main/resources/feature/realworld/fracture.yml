# =============================================================================
# 骨折系统配置
# =============================================================================
# 功能概述：
#   - 高处坠落会导致骨折，骨折值越高移动速度越慢
#   - 骨折值范围 0~100，可通过绷带或石膏治疗
#   - 骨折会自然恢复，但速度较慢
#
# 骨折等级：
#   0~19  → 无骨折（正常速度）
#   20~49 → 轻微骨折（移动速度 -20%）
#   50~79 → 中度骨折（移动速度 -50%，禁止疾跑）
#   80~100 → 严重骨折（移动速度 -80%，禁止疾跑）

# 是否启用骨折系统
enabled: true

# 坠落伤害阈值
# 低于此值的坠落伤害不会导致骨折
# 原版 Minecraft 中，3 格高度坠落造成 1 点伤害（0.5 心）
# 默认值 4.0 相当于从约 6 格高度坠落
min-fall-damage: 4.0

# 伤害转换为骨折值的倍率
# 公式：骨折值增加 = (坠落伤害 - 阈值) × 倍率
# 例如：10 点伤害，阈值 4，倍率 5 → 增加 30 点骨折值
damage-multiplier: 5.0

# 自然恢复速率（每分钟恢复的骨折值）
# 中度及以上骨折时，恢复速率减半
recovery-rate: 2.0

# 绷带治疗量（每次使用恢复的骨折值）
bandage-heal-amount: 30.0

# 绷带物品材质
# 使用此材质的物品可作为绷带治疗骨折
bandage-material: []

# 石膏物品材质
# 使用此材质的物品可完全治愈骨折
cast-material: []

# 骨折等级阈值
thresholds:
  # 轻微骨折阈值（骨折值达到此值时触发）
  mild: 20.0
  # 中度骨折阈值
  moderate: 50.0
  # 严重骨折阈值
  severe: 80.0
