# ========================================
#  食物腐蚀系统 - food-corrosion
# ========================================
#  食物在背包中会随时间逐渐腐蚀，到期后自动变为配置的物品。
#  Lore 以"过期时间: Xd"形式显示，每天刷新一次。
#  保质期由每物品独立配置，不同食物保质期不同。

# 配置版本号（用于未来迁移）
version: 2

# ----------------------------------------
#  总开关
# ----------------------------------------
#  设为 false 可完全关闭食物腐蚀功能，
#  同时禁用 Packet 监听器（零性能开销）。
enabled: true

# ----------------------------------------
#  默认保质期（天）
# ----------------------------------------
#  食物从获得时开始计算的保质期天数。
#  未在 item-days 中列出的食物使用此默认值。
#  范围: 1 ~ 365
default-days: 14

# ----------------------------------------
#  过期后变成的物品
# ----------------------------------------
#  食物完全腐蚀后变成的物品 Material 名称。
#  默认为腐肉，可设置为 AIR 表示直接消失。
expired-item: ROTTEN_FLESH

# ----------------------------------------
#  腐烂提示消息
# ----------------------------------------
#  食物完全腐蚀变为指定物品时发送给玩家的消息。
#  设为空字符串 "" 可关闭提示。
conversion-message: "&e你的食物已经完全腐烂了！"

# ----------------------------------------
#  豁免物品列表
# ----------------------------------------
#  以下 Material 名称的食物不会参与腐蚀计算。
#  已默认排除腐肉、金苹果、附魔金苹果、药水、迷之炖菜。
excluded-items:
  - ROTTEN_FLESH
  - GOLDEN_APPLE
  - ENCHANTED_GOLDEN_APPLE
  - POTION
  - SUSPICIOUS_STEW

# ----------------------------------------
#  物品专属保质期
# ----------------------------------------
#  为特定食物 Material 设置独立保质期天数。
#  未列出的食物使用上面的 default-days。
#  数值越大 → 保质期越长。
#
#  示例:
#    RAW_BEEF: 3    → 生牛肉 3 天过期
#    COOKED_BEEF: 7 → 熟牛肉 7 天过期
#    BREAD: 21      → 面包 21 天过期
item-days:
  RAW_BEEF: 3
  COOKED_BEEF: 7
  BREAD: 21

# ----------------------------------------
#  Lore 显示格式
# ----------------------------------------
#  可用占位符:
#    {days}  — 剩余天数（整数）
#    {color} — 根据剩余比例自动变色的颜色代码
#               >50% 绿色 &a / >25% 黄色 &e / >10% 红色 &c / <=10% 深红 &4
#
#  Lore 仅在剩余天数发生变化时刷新，不会每个包都更新。
lore-format: "&7过期时间: {color}{days}d"
