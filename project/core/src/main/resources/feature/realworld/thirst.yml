# =============================================================================
# 口渴系统配置
# =============================================================================
# 功能概述：
#   - 玩家会持续失去水分，需要定期饮水补充
#   - 口渴值过低会触发负面效果（饥饿、缓慢、凋零）
#   - 奔跑、高温、高海拔会加速水分流失
#   - 可通过水瓶、天然水源、饮水机等方式补水
#
# 口渴阶段：
#   > 60  → 充足（无负面效果）
#   30~60 → 口渴（饥饿 I）
#   10~30 → 严重口渴（饥饿 II + 缓慢 I）
#   < 10  → 脱水（凋零）

# 每分钟基础水分流失量
base-rate-per-minute: 0.5

# 奔跑时水分流失倍率
sprint-multiplier: 2.0

# 浸水时水分流失倍率（水中流失更慢）
submerge-multiplier: 0.1

# 高海拔水分流失起始高度（Y坐标）
altitude-threshold-y: 100

# 高海拔水分流失倍率
altitude-multiplier: 1.2

# 温度偏离舒适区时，每偏离 1°C 增加的水分流失百分比
# 例如：体温 42°C（偏离 6°C），流失量增加 12%
temperature-deviation-percent-per-degree: 2.0

# 口渴阶段阈值
thresholds:
  # 充足阈值（高于此值无负面效果）
  full: 60.0
  # 口渴阈值
  thirsty: 30.0
  # 严重口渴阈值
  severe: 10.0

# 水源恢复量
water-sources:
  # 水瓶恢复量
  water-bottle: 30.0
  # 右键天然水源恢复量（河流、湖泊）
  right-click-source: 20.0
  # 饮水机（炼药锅）恢复量
  drinker: 40.0
  # 站在雨中每分钟恢复量
  rain-per-minute: 2.0
  # 海水恢复量（但会触发恶心）
  sea-water: 10.0

# 饮水机使用冷却时间（秒）
drinker-cooldown-seconds: 2

# 水质配置（饮用不洁水源的副作用）
water-quality:
  # 饮用河水触发恶心的概率（0.0~1.0）
  river-nausea-chance: 0.1
  # 饮用海水触发恶心的概率（0.0~1.0，海水必定恶心）
  sea-water-nausea-chance: 1.0
