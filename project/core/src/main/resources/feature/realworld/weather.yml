# =============================================================================
# 天气系统配置（噪声驱动 · 仅晴天/雨天）
# =============================================================================
# 功能概述：
#   - 采用 RealLife 风格的 3D 噪声驱动降雨
#   - 天气类型仅保留：晴天、雨天
#   - 不同区块依据噪声可呈现不同的晴/雨状态
#   - 季节会修正降雨概率（春多雨、冬最多、夏秋偏少）
#
# 说明：
#   底层噪声计算每个区块的"降雨值"，低于(基础概率 × 季节修正)即判定为下雨。
#   原版下雨视觉会按各世界出生点的代表性天气同步。

# 降雨配置
rain:
  # 基础降雨概率（0.0~1.0）
  # 实际阈值 = probability × 季节修正(春2.5 / 夏1.0 / 秋0.8 / 冬4.0)，并裁剪到 1.0
  probability: 0.2

# 严重需求伤害配置
# 用于极端体温 / 脱水等"严重生存状态"的持续伤害节奏
extreme:
  # 宽限期（秒）：进入严重状态后多少秒开始造成伤害
  grace-period-seconds: 10
  # 伤害间隔（秒）：每隔多少秒造成一次伤害
  damage-interval-seconds: 3
  # 基础伤害（心）
  base-damage-hearts: 2.0

# 局部天气（噪声）配置
local:
  # 是否启用噪声驱动天气
  enabled: true
  # 噪声频率（值越小天气区域越大，推荐 0.01~0.02）
  noise-frequency: 0.015
  # 天气随时间变化的速度系数（值越小变化越慢）
  change-speed: 0.001
  # 最大缓存大小（区块数）
  cache-max-size: 1000
