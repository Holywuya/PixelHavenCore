# =============================================================================
# 天气系统配置
# =============================================================================
# 功能概述：
#   - 自定义天气系统，支持多种天气类型
#   - 天气类型：晴天、雨天、雷暴、雪天、暴风雪、沙尘暴、雾、酸雨
#   - 极端天气（暴风雪/沙尘暴/酸雨）会持续造成伤害
#   - 支持局部天气：不同区块可以有不同的天气
#
# 极端天气效果：
#   暴风雪：缓慢 II + 失明 II + 持续伤害
#   沙尘暴：缓慢 I + 挖掘疲劳 I + 失明 III + 持续伤害
#   酸雨：虚弱 I + 中毒 + 持续伤害

# 天气决策间隔（秒）
# 每隔多久决定一次天气变化
decision-interval-seconds: 300

# 天气持续概率（0.0~1.0）
# 当前天气继续维持的概率，值越大天气变化越少
persistence-chance: 0.6

# 极端天气配置
extreme:
  # 预警倒计时（秒）
  # 极端天气到来前多少秒开始预警（0 = 直接到来，无预警）
  warning-seconds: 30
  # 宽限期（秒）
  # 极端天气到来后多少秒开始造成伤害
  grace-period-seconds: 10
  # 伤害间隔（秒）
  # 每隔多少秒造成一次伤害
  damage-interval-seconds: 3
  # 基础伤害（心）
  # 每次造成的基础伤害值（实际伤害会根据天气类型和强度调整）
  base-damage-hearts: 2.0

# 视觉效果配置
visibility:
  # 药水效果持续时间（秒）
  # 使用短持续时间自动续期，避免清除玩家自身获得的同类药水效果
  effect-duration-seconds: 3
  # 雾天失明等级
  fog:
    blindness-amplifier: 0
  # 暴风雪失明等级
  blizzard:
    blindness-amplifier: 1
  # 沙尘暴失明等级
  sandstorm:
    blindness-amplifier: 2

# 局部天气配置
# 启用后不同区块可以有不同的天气
local:
  # 是否启用局部天气
  enabled: true
  # 噪声频率（值越小天气区域越大，推荐 0.01~0.02）
  noise-frequency: 0.015
  # 天气变化速度系数（值越小天气变化越慢）
  change-speed: 0.001
  # 是否启用天气缓存（提升性能）
  cache-enabled: true
  # 最大缓存大小（区块数）
  cache-max-size: 1000
