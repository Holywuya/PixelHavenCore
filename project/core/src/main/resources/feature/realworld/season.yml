# =============================================================================
# 季节系统配置
# =============================================================================
# 功能概述：
#   - 游戏内季节会随时间自动轮换：春 → 夏 → 秋 → 冬 → 春...
#   - 季节影响环境温度、天气概率、水分流失速率
#   - 季节之间有平滑过渡，不会突然切换
#
# 季节效果：
#   春：温度 +5°C，天气以晴天和雨天为主
#   夏：温度 +15°C，水分流失 ×1.5，可能出现沙尘暴
#   秋：温度不变，天气以雨天和雾天为主
#   冬：温度 -15°C，水分流失 ×0.6，可能出现暴风雪

# 是否启用自定义时间流速
# 启用后：现实 1 小时 = 游戏 1 天（原版 20 分钟 = 1 天）
# 关闭后：使用原版 Minecraft 时间流速
time-control:
  enabled: true

# 季节持续游戏天数
# 启用时间控制时：7 天 = 现实 7 小时
# 原版时间流速：7 天 = 现实 140 分钟
duration-days: 7

# 季节过渡进度（0.0~1.0）
# 控制季节切换时的平滑过渡范围
# 0.1 表示在最后 10% 的时间内开始向下一季节过渡
# 值越大过渡越明显，值为 0 则瞬间切换
transition-progress: 0.1
