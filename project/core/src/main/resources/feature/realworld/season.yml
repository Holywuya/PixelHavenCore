# =============================================================================
# 季节系统配置
# =============================================================================

# 是否启用自定义时间流速（true=启用，false=使用原版时间流速）
# 启用后：游戏1天 = 60分钟（现实时间），时间流速变为 1/3
time-control:
  enabled: false

# 季节持续游戏天数
# 默认 7 天
# 启用时间控制时：7 天 = 现实 7 小时
# 原版时间流速：7 天 = 现实 140 分钟
duration-days: 7
transition-progress: 0.1
