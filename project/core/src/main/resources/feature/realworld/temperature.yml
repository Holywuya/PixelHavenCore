# =============================================================================
# 体温系统配置
# =============================================================================
# 功能概述：
#   - 玩家体温会根据环境、季节、天气、海拔等因素变化
#   - 体温过高或过低会触发负面效果（缓慢、挖掘疲劳、凋零等）
#   - 穿戴皮革装备可增加耐寒/耐热能力
#   - 靠近热源（营火、岩浆等）可提升局部温度
#
# 体温阶段：
#   > 42°C  → 严重过热（凋零 + 失明）
#   36~42°C → 过热（缓慢 + 饥饿）
#   15~36°C → 舒适（无负面效果）
#   5~15°C  → 轻微寒冷（饥饿）
#   -5~5°C  → 寒冷（缓慢 + 挖掘疲劳）
#   < -5°C  → 严重寒冷（缓慢 II + 凋零）

# 舒适温度下限（°C）
comfort-min: 15

# 舒适温度上限（°C）
comfort-max: 36

# 海拔温度衰减起始高度（Y坐标）
# 超过此高度后，每升高 1 格温度降低 altitude-drop-per-block 度
altitude-threshold-y: 80

# 每升高 1 格温度降低的度数
altitude-drop-per-block: 0.5

# 热源扫描间隔（秒）
# 每隔多久扫描一次周围方块对温度的影响
scan-interval-seconds: 5

# 体温变化限速（动态）
# 上限 = base + |温差| × dynamic-scale
# 极端环境变化更快，温和环境更平滑
max-change:
  # 基础限速（°C/tick）
  base: 0.5
  # 动态缩放（每 1°C 温差增加的上限）
  dynamic-scale: 0.02

# 温度吸收速率
# 控制体温趋近环境温度的速度曲线
# 值越大，温差大时变化越快，温差小时变化越慢
# 推荐范围 0.05~0.2
temperature:
  absorption-rate: 0.1

# 遮蔽判定配置
shelter:
  # 玻璃方块是否算作遮蔽物（影响天气暴露判定）
  glass-counts-as-shelter: true
  # 树叶方块是否算作遮蔽物
  leaves-counts-as-shelter: true
  # 水平扫描半径（格），用于判定玩家是否在室内
  horizontal-radius: 1
  # 树冠/半遮蔽绝缘百分比
  canopy-insulation: 0.15
  # 建筑/完全遮蔽绝缘百分比
  building-insulation: 0.25

# 护甲绝缘配置
# 穿戴装备时减缓环境温差对体温的影响（冷天保暖、热天隔热）
# 值为每件装备的绝缘百分比，总绝缘 = Σ 各件绝缘
armor-insulation:
  # 皮革装备绝缘（每件 8%，4 件 = 32%）
  leather: 0.08
  # 下界合金装备绝缘（每件 12%，4 件 = 48%）
  netherite: 0.12
  # 绝缘上限（防止完全隔绝环境影响）
  max: 0.7

# 体温阈值（°C）
# 定义各阶段的触发温度
thresholds:
  # 严重过热阈值
  severe-heat: 42.0
  # 过热阈值
  heat: 36.0
  # 轻微寒冷阈值
  cold-mild: 15.0
  # 寒冷阈值
  cold: 5.0
  # 严重寒冷阈值
  severe-cold: -5.0

# =============================================================================
# 霜冻遮罩配置
# =============================================================================
# 低温时向客户端发送伪装的 frozenTicks metadata，触发原生冰霜覆盖全屏效果
# 数值越大霜冻越重，最大 299（>= 300 会触发服务端冻伤减速）

frost-overlay:
  # 寒冷阶段的霜冻强度
  cold-intensity: 100
  # 严重寒冷阶段的霜冻强度
  severe-cold-intensity: 250

# =============================================================================
# 高温红屏配置
# =============================================================================
# 通过 WorldBorder 的 warningDistance 实现全屏红色叠加
# 范围 0.0~1.0，0 表示关闭

heat-overlay:
  # 过热阶段的红屏强度
  heat-intensity: 0.3
  # 严重过热阶段的红屏强度
  severe-intensity: 0.8

# =============================================================================
# 潮湿度配置
# =============================================================================
# 玩家在水中/雨中会变潮，潮湿度越高体温越难维持
# 潮湿度范围 0.0~1.0

wetness:
  # 每秒浸水增加量（站在水中）
  rate-submerge: 0.05
  # 每秒雨中增加量（需暴露在露天）
  rate-rain: 0.01
  # 每秒自然干燥量（气温 > 30°C 时自动翻倍）
  dry-rate: 0.005

# =============================================================================
# 体感温度配置
# =============================================================================
# 体感温度是综合多种因素后的实际感受温度

feels-like:
  # 潮湿度的蒸发冷却系数（°C）
  # 满湿度时的降温效果
  wetness-cooling: 8.0

# =============================================================================
# 昼夜温差配置
# =============================================================================

time:
  # 昼夜温差缩放系数
  # 基础昼夜温差为 ±5°C，此系数会放大/缩小温差
  day-night-scale: 10.0

# =============================================================================
# 水温配置
# =============================================================================
# 独立的水温系统，水温与气温分离

water:
  # 是否启用水温系统
  enabled: true
  # 水的导热系数（相对于空气）
  # 水的导热速度是空气的 25 倍，游戏中设为 4 倍以保持可玩性
  thermal-conductivity: 4.0
  # 出水后过渡阈值（潮湿度高于此值时混合水温）
  exit-blend-threshold: 0.5

# =============================================================================
# 温度方块配置
# =============================================================================
# 周围方块对局部温度的辐射加热/冷却效果
# 使用衰减叠加模型：modifier = Σ (方块温度 - 环境温度) × 衰减因子^距离
# 衰减因子默认 0.5，每远 1 格效果减半
# 多热源可叠加但有自然衰减，不会无限累加
# 示例：篝火45°C在环境20°C、距离1格时产生 (45-20) × 0.5^1 = +12.5°C

temperature-blocks:
  # 衰减因子（0.1-0.9，越小衰减越快）
  decay-factor: 0.5

  # 制冷方块（负值 = 降温）
  BLUE_ICE: -15
  PACKED_ICE: -12
  POWDER_SNOW: -10
  SNOW_BLOCK: -8
  ICE: -8
  SNOW: -5

  # 制热方块（正值 = 升温）
  GLOWSTONE: 28
  SOUL_TORCH: 32
  SOUL_CAMPFIRE: 40
  SOUL_LANTERN: 38
  JACK_O_LANTERN: 35
  LANTERN: 30
  TORCH: 32
  MAGMA_BLOCK: 45
  FURNACE: 40
  BLAST_FURNACE: 40
  SMOKER: 40
  CAMPFIRE: 45
  LAVA: 65

# =============================================================================
# 体温调节配置
# =============================================================================
# 模拟真实人体体温调节机制
# 体温自动趋向舒适区间中值，调节能力受饱食度和环境影响

regulation:
  # 是否启用体温调节机制
  # 启用后体温会自动趋向舒适区间中值
  enabled: true
  # 回拉强度系数（每偏离 1°C 产生的回拉力）
  # 推荐范围 0.02~0.1，值越大调节越快
  strength: 0.05
