# =============================================================================
# 体温系统配置
# =============================================================================
# 功能概述：
#   - 玩家体温会根据环境、季节、天气、海拔等因素变化
#   - 体温过高或过低会触发负面效果（缓慢、挖掘疲劳、凋零等）
#   - 穿戴皮革装备可增加耐寒/耐热能力
#   - 靠近热源（营火、岩浆等）可提升局部温度
#
# 体温阶段：
#   > 42°C  → 严重过热（凋零 + 失明）
#   36~42°C → 过热（缓慢 + 饥饿）
#   15~36°C → 舒适（无负面效果）
#   5~15°C  → 轻微寒冷（饥饿）
#   -5~5°C  → 寒冷（缓慢 + 挖掘疲劳）
#   < -5°C  → 严重寒冷（缓慢 II + 凋零）

# 舒适温度下限（°C）
comfort-min: 15

# 舒适温度上限（°C）
comfort-max: 36

# 海拔温度衰减起始高度（Y坐标）
# 超过此高度后，每升高 1 格温度降低 altitude-drop-per-block 度
altitude-threshold-y: 80

# 每升高 1 格温度降低的度数
altitude-drop-per-block: 0.5

# 热源扫描间隔（秒）
# 每隔多久扫描一次周围方块对温度的影响
scan-interval-seconds: 5

# 每次体温计算最大变化量（°C）
# 防止温度瞬间跳变过大
max-change-per-tick: 0.5

# 遮蔽判定配置
shelter:
  # 玻璃方块是否算作遮蔽物（影响天气暴露判定）
  glass-counts-as-shelter: false
  # 树叶方块是否算作遮蔽物
  leaves-counts-as-shelter: false
  # 水平扫描半径（格），用于判定玩家是否在室内
  horizontal-radius: 1
  # 树荫/树冠遮蔽加成（°C）
  canopy-bonus: 2.0
  # 建筑物内部遮蔽加成（°C）
  building-bonus: 8.0

# 护甲温度加成
# 穿戴对应材质装备时，体温更稳定（减少极端温度影响）
armor-bonus:
  # 皮革装备加成（每件）
  leather: 5
  # 下界合金装备加成（每件）
  netherite: 10

# 体温阈值（°C）
# 定义各阶段的触发温度
thresholds:
  # 严重过热阈值
  severe-heat: 42.0
  # 过热阈值
  heat: 36.0
  # 轻微寒冷阈值
  cold-mild: 15.0
  # 寒冷阈值
  cold: 5.0
  # 严重寒冷阈值
  severe-cold: -5.0

# =============================================================================
# 霜冻遮罩配置
# =============================================================================
# 低温时向客户端发送伪装的 frozenTicks metadata，触发原生冰霜覆盖全屏效果
# 数值越大霜冻越重，最大 299（>= 300 会触发服务端冻伤减速）

frost-overlay:
  # 寒冷阶段的霜冻强度
  cold-intensity: 100
  # 严重寒冷阶段的霜冻强度
  severe-cold-intensity: 250

# =============================================================================
# 高温红屏配置
# =============================================================================
# 通过 WorldBorder 的 warningDistance 实现全屏红色叠加
# 范围 0.0~1.0，0 表示关闭

heat-overlay:
  # 过热阶段的红屏强度
  heat-intensity: 0.3
  # 严重过热阶段的红屏强度
  severe-intensity: 0.8

# =============================================================================
# 潮湿度配置
# =============================================================================
# 玩家在水中/雨中会变潮，潮湿度越高体温越难维持
# 潮湿度范围 0.0~1.0

wetness:
  # 每秒浸水增加量（站在水中）
  rate-submerge: 0.05
  # 每秒雨中增加量（需暴露在露天）
  rate-rain: 0.01
  # 每秒自然干燥量（气温 > 30°C 时自动翻倍）
  dry-rate: 0.005

# =============================================================================
# 体感温度配置
# =============================================================================
# 体感温度是综合多种因素后的实际感受温度

feels-like:
  # 潮湿度的蒸发冷却系数（°C）
  # 满湿度时的降温效果
  wetness-cooling: 8.0

# =============================================================================
# 昼夜温差配置
# =============================================================================

time:
  # 昼夜温差缩放系数
  # 基础昼夜温差为 ±5°C，此系数会放大/缩小温差
  day-night-scale: 10.0

# =============================================================================
# 水温配置
# =============================================================================
# 独立的水温系统，水温与气温分离

water:
  # 是否启用水温系统
  enabled: true
  # 水的导热系数（相对于空气）
  # 水的导热速度是空气的 25 倍，游戏中设为 4 倍以保持可玩性
  thermal-conductivity: 4.0

# =============================================================================
# 温度方块配置
# =============================================================================
# 周围方块对局部温度的辐射加热/冷却效果
# 温度值为辐射源参考温度（°C），使用参考温度法计算偏移：
#   偏移 = (方块温度 - 舒适中点25.5°C) / 衰减系数5
# 权重公式：1 / max(0.5, 距离²)，扫描半径 5 格
# 示例：篝火80°C在1格距离产生 (80-25.5)/5 = +10.9°C 的体感加热

temperature-blocks:
  # 制冷方块（负值 = 降温）
  BLUE_ICE: -25
  PACKED_ICE: -20
  POWDER_SNOW: -20
  SNOW_BLOCK: -15
  ICE: -10
  SNOW: -8
  # 制热方块（正值 = 升温）
  GLOWSTONE: 30
  SOUL_TORCH: 40
  SOUL_CAMPFIRE: 55
  SOUL_LANTERN: 50
  JACK_O_LANTERN: 45
  LANTERN: 50
  TORCH: 55
  MAGMA_BLOCK: 65
  FURNACE: 60
  BLAST_FURNACE: 60
  SMOKER: 60
  CAMPFIRE: 80
  LAVA: 120
