# =============================================================================
# 体力系统配置
# =============================================================================
# 功能概述：
#   - 玩家行动会消耗体力，体力耗尽后会受到负面效果
#   - 体力可通过静止休息、进食、饮水、睡觉等方式恢复
#   - 与体温、骨折、口渴、天气、季节等系统深度联动
#
# 体力阶段：
#   > 60%  → 充沛（无负面效果）
#   30~60% → 疲劳（移动速度 -15%）
#   10~30% → 筋疲力尽（移动速度 -30%，禁止疾跑，挖掘疲劳 I + 虚弱 I）
#   < 10%  → 体力耗尽（移动速度 -50%，禁止疾跑，挖掘疲劳 II + 虚弱 II）

# 是否启用体力系统
enabled: true

# 最大体力值
max-stamina: 100.0

# 基础消耗速率（每秒消耗量）
# 纯奔跑约 16 分钟耗尽
base-consumption-rate: 0.05

# 基础恢复速率（每秒恢复量）
# 静止休息约 5.5 分钟回满
base-recovery-rate: 0.3

# 消耗倍率叠加上限
# 防止极端情况瞬间耗尽体力
max-multiplier: 5.0

# =============================================================================
# 持续消耗（奔跑/游泳/攀爬时每秒消耗）
# =============================================================================
continuous:
  # 奔跑消耗倍率（×基础消耗速率）
  sprint-multiplier: 2.0
  # 游泳消耗倍率
  swim-multiplier: 2.5
  # 攀爬消耗倍率
  climb-multiplier: 2.0

# =============================================================================
# 动作消耗（执行动作时瞬间扣除）
# =============================================================================
actions:
  # 攻击消耗（每次攻击扣除）
  attack-cost: 0.15
  # 挖掘消耗（每次破坏方块扣除）
  mine-cost: 0.075
  # 使用工具消耗（锄头耕地、铲子挖沙等）
  use-tool-cost: 0.1

# =============================================================================
# 特殊场景消耗
# =============================================================================
special:
  # 水下憋气消耗倍率（氧气条下降时触发）
  underwater-multiplier: 4.0
  # 高空作业消耗倍率（Y > high-altitude-y 且未着地）
  high-altitude-multiplier: 2.0
  # 高空判定高度阈值
  high-altitude-y: 120

# =============================================================================
# 恢复方式
# =============================================================================
recovery:
  # 静止休息（站定不动一段时间后自动恢复）
  idle:
    enabled: true
    # 静止多久后开始恢复（秒）
    delay-seconds: 3.0
    # 恢复倍率（×基础恢复速率）
    multiplier: 1.0
    # 极端温度下禁止休息恢复
    blocked-in-extreme-temperature: true
    # 水下禁止休息恢复
    blocked-underwater: true
    # 受到攻击时禁止休息恢复
    blocked-when-attacked: true

  # 进食恢复
  food:
    enabled: true
    # 饥饿值转换为体力的比例
    # 例如：熟牛排恢复 8 饥饿值 → 恢复 16 体力
    hunger-to-stamina-ratio: 2.0
    # 腐烂食物恢复量惩罚倍率（0.5 = 只恢复一半）
    rotten-food-penalty: 0.5
    # 进食冷却时间（秒）
    cooldown-seconds: 1.0

  # 饮水恢复
  drink:
    enabled: true
    # 口渴值转换为体力的比例
    # 例如：水瓶恢复 30 口渴值 → 恢复 15 体力
    hydration-to-stamina-ratio: 0.5

  # 睡觉恢复（瞬间回满）
  sleep:
    enabled: true
    # 室外睡觉恢复百分比（0~100）
    # 室内睡觉恢复 100%，室外只恢复此百分比
    outdoor-recovery-percent: 50.0
    # 极端温度下禁止睡觉恢复
    blocked-in-extreme-temperature: true

  # 特殊物品恢复
  special-items:
    enabled: true
    # 物品材质 → 恢复最大体力的百分比
    items:
      GOLDEN_APPLE: 50.0
      ENCHANTED_GOLDEN_APPLE: 100.0

# =============================================================================
# 惩罚阶段
# =============================================================================
penalties:
  # 疲劳阶段（30%~60%）
  tired:
    # 进入此阶段的体力百分比阈值
    threshold: 60.0
    # 移动速度倍率（0.85 = 速度 -15%）
    speed-multiplier: 0.85

  # 筋疲力尽阶段（10%~30%）
  exhausted:
    threshold: 30.0
    speed-multiplier: 0.70
    # 挖掘疲劳等级（0 = I 级，1 = II 级）
    mining-fatigue-amplifier: 0
    # 虚弱等级
    weakness-amplifier: 0

  # 体力耗尽阶段（< 10%）
  depleted:
    threshold: 10.0
    speed-multiplier: 0.50
    mining-fatigue-amplifier: 1
    weakness-amplifier: 1

  # 药水效果持续时间（秒）
  # 使用短持续时间自动续期，避免清除玩家自身获得的同类药水效果
  effect-duration-seconds: 3

# =============================================================================
# 聊天提醒消息
# =============================================================================
# 可用变量：{stamina} 当前体力百分比
messages:
  # 进入疲劳阶段
  enter-tired: "&e⚡ 你感到有些疲劳了... (体力: {stamina}%)"
  # 进入筋疲力尽阶段
  enter-exhausted: "&c⚡ 你筋疲力尽了！无法疾跑！ (体力: {stamina}%)"
  # 进入体力耗尽阶段
  enter-depleted: "&4⚡ 体力耗尽！你几乎无法行动！ (体力: {stamina}%)"
  # 体力耗尽持续提醒
  depleted-reminder: "&4⚡ 你需要休息或进食来恢复体力！ (体力: {stamina}%)"
  # 从疲劳恢复
  recovered-from-tired: "&a⚡ 你感觉好多了。 (体力: {stamina}%)"
  # 从筋疲力尽恢复
  recovered-from-exhausted: "&a⚡ 你恢复了一些精力。 (体力: {stamina}%)"
  # 从体力耗尽恢复
  recovered-from-depleted: "&a⚡ 你终于缓过来了。 (体力: {stamina}%)"
  # 体力耗尽提醒冷却时间（秒），防止刷屏
  depleted-reminder-cooldown-seconds: 30

# =============================================================================
# HUD 显示配置
# =============================================================================
hud:
  # 是否在 BossBar 显示体力警告
  bossbar-enabled: true
  # 筋疲力尽阶段警告文案
  bossbar-title-exhausted: "&e⚡ 体力不足！寻找食物或休息！"
  # 体力耗尽阶段警告文案
  bossbar-title-depleted: "&4⚡ 体力耗尽！你几乎无法行动！"
  # 筋疲力尽阶段 BossBar 颜色
  # 可选值：BLUE / GREEN / PINK / PURPLE / RED / WHITE / YELLOW
  bossbar-color-exhausted: "YELLOW"
  # 体力耗尽阶段 BossBar 颜色
  bossbar-color-depleted: "RED"
  # BossBar 样式
  # 可选值：SOLID / SEGMENTED_6 / SEGMENTED_10 / SEGMENTED_12 / SEGMENTED_20
  bossbar-style: "SOLID"

# =============================================================================
# 系统联动配置
# =============================================================================
# 体力系统与其他生存系统的联动效果

integration:
  # 体温联动
  temperature:
    enabled: true
    # 极端温度（过热/过冷）消耗倍率
    extreme-multiplier: 1.5
    # 轻微温度异常消耗倍率
    mild-multiplier: 1.2

  # 骨折联动
  fracture:
    enabled: true
    # 骨折值超过此阈值时触发联动
    threshold: 20.0
    # 骨折状态下的消耗倍率
    consumption-multiplier: 1.3
    # 骨折导致的最大体力减少量
    # 骨折时最大体力 = max-stamina - 此值
    max-stamina-reduction: 30.0

  # 口渴联动
  thirst:
    enabled: true
    # 口渴值低于此阈值时触发联动
    dehydration-threshold: 30.0
    # 脱水状态下的恢复倍率（0.5 = 恢复速度减半）
    recovery-multiplier: 0.5

  # 潮湿度联动
  wetness:
    enabled: true
    # 潮湿度超过此阈值时触发联动
    threshold: 0.7
    # 潮湿状态下的消耗倍率
    consumption-multiplier: 1.2

  # 饱食度联动
  food:
    enabled: true
    # 饱食度满时的恢复加成倍率（1.25 = 恢复速度 +25%）
    full-saturation-bonus: 1.25

  # 天气联动
  weather:
    enabled: true
    # 极端天气（暴风雪/沙尘暴）消耗倍率
    extreme-multiplier: 1.3

  # 季节联动
  season:
    enabled: true
    # 冬季消耗倍率
    winter-multiplier: 1.1
    # 夏季消耗倍率
    summer-multiplier: 1.05
