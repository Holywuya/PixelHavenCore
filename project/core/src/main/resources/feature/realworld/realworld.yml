# =============================================================================
# RealWorld 核心配置
# =============================================================================
# 此文件仅包含模块全局设置和 HUD 显示配置
# 各子系统配置已拆分到独立文件：temperature.yml / thirst.yml / weather.yml / season.yml / fracture.yml / stamina.yml

# 是否启用 RealWorld 模块（总开关）
# 关闭后所有子系统停止工作，玩家数据保留但不再更新
enabled: true

# 每隔多少秒执行一次生存状态计算（体温、口渴、体力等）
# 值越小越精确，但性能开销越大（推荐 1~3 秒）
tick-interval-seconds: 2

# 自动保存间隔（分钟）
# 玩家生存数据每隔多久持久化到数据库
auto-save-interval-minutes: 5

# =============================================================================
# HUD 显示配置
# =============================================================================
# 控制玩家屏幕上显示的生存信息

hud:
  # ActionBar 格式（屏幕底部中央）
  # 可用变量：{temp} 体温 / {hydration} 口渴 / {wetness} 潮湿度 / {sheltered} 遮蔽状态 / {weather} 天气 / {season} 季节
  actionbar-format: "&c🌡 {temp}°C  &b💧 {hydration}/100  &9💦 {wetness}%  {sheltered}  &f{weather}  &a{season}"

  # 是否启用 ActionBar HUD（屏幕底部中央的生存信息）
  actionbar-enabled: true

  # 遮蔽状态指示器（玩家在室内时显示）
  sheltered-indicator: "&a🏠"
  # 未遮蔽状态指示器（玩家在室外时显示）
  unsheltered-indicator: "&7☁"

  # ActionBar 刷新间隔（秒）
  refresh-interval-seconds: 2

  # BossBar 警告（极端状态时显示在屏幕顶部）
  bossbar-enabled: true
  # 严重过热警告文案
  bossbar-title-heat: "&c严重过热！寻找阴凉处！"
  # 严重过冷警告文案
  bossbar-title-cold: "&b严重过冷！寻找热源！"
  # 严重脱水警告文案
  bossbar-title-thirst: "&e严重脱水！寻找水源！"
