version: 6

# =============================================================================
# 经济系统核心配置
# =============================================================================
# 功能说明：
#   - 管理服务器经济系统的核心设置
#   - 支持多货币系统（如金币、宝石等）
#   - 集成 Vault 接口，兼容其他插件
#   - 与中心银行和税务系统联动

# 功能开关（true = 启用，false = 禁用）
enabled: true

# 默认货币 ID
# 只有默认货币会进入中心银行 C/D 双账户治理与税务收益池
# 必须在下方 currencies 中定义
default-currency: coin

# 数据存储配置
storage:
  # 玩家余额自动保存间隔（单位：tick，20tick = 1秒）
  # 数值越小，磁盘/数据库写入越频繁，数据安全性越高但性能消耗越大
  # 默认 100 tick = 5 秒
  auto-save-ticks: 100

# 货币定义
# currencies 下的每个子键都代表一种货币，可自由增删
# 每种货币需要定义单数和复数形式的显示名称
currencies:
  # 金币（默认货币）
  coin:
    # 单数形式显示名称（如: 1 Coin）
    singular: Coin
    # 复数形式显示名称（如: 10 Coins）
    plural: Coins
  # 宝石（自定义货币）
  gem:
    # 单数形式显示名称（如: 1 Gem）
    singular: Gem
    # 复数形式显示名称（如: 10 Gems）
    plural: Gems
