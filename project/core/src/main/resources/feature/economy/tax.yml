version: 6

# =============================================================================
# 税收系统配置
# =============================================================================
# 功能说明：
#   - 对玩家通过 Vault 获得的收入进行统一征税
#   - 支持阶梯税率和边际税率计算
#   - 收入先进入"个人收益池"，到指定时间统一结税
#   - 税款自动转入中心银行 C 账户
#   - 支持多种交易场景的税收控制

# 总开关（true=启用，false=禁用）
enabled: true

# 交易场景税收开关
# 控制哪些交易场景需要缴税
scenes:
  # 菜单交易场景（通过 TaxService API 显式调用）
  menu-trade: true
  # 命令交易场景（通过 TaxService API 显式调用）
  command-trade: true
  # 玩家交易场景（通过 TaxService API 显式调用）
  player-trade: true

# 玩家交易专用设置
player-trade:
  # 玩家交易税预览接口默认税率（范围: 0.0-1.0）
  # 统一结税时，实际税额仍优先按 tax-brackets 匹配结果计算
  default-tax-rate: 0.02

# 是否使用边际（累进）税率
# true  — 收入按阶梯分档计税（如 5000 = 1000×0% + 4000×3%）
# false — 收入全额按最高匹配档计税（如 5000 全按 6%）
use-marginal-rate: true

# 阶梯税率配置
# 按"玩家当前收益池总额"匹配最高档
# 每个 tier 包含:
#   min  - 该档的最低收益池阈值
#   rate - 该档的税率（范围: 0.0-1.0）
tax-brackets:
  # 第一档: 0-999 免税
  tier1:
    min: 0
    rate: 0.00
  # 第二档: 1000-4999 按 3% 征税
  tier2:
    min: 1000
    rate: 0.03
  # 第三档: 5000-9999 按 6% 征税
  tier3:
    min: 5000
    rate: 0.06
  # 第四档: 10000+ 按 10% 征税
  tier4:
    min: 10000
    rate: 0.10

# 统一结税配置
settlement:
  # 是否启用统一结税（true=启用，false=禁用）
  enabled: true
  # 结税时间配置
  time:
    # 结税小时（24小时制，默认凌晨 4:00）
    hour: 4
    # 结税分钟
    minute: 0
  # 异步检查是否到达结税时间的间隔（单位：tick，20tick = 1秒）
  check-interval-ticks: 200
  # 个人收益池/欠税数据持久化间隔（单位：tick，20tick = 1秒）
  pool-persist-interval-ticks: 40
  # 结税广播配置
  broadcast:
    # 是否启用结税广播（true=启用，false=禁用）
    enabled: true
    # 广播消息格式
    # 占位符:
    #   {amount}      - 本次实际收税总额
    #   {outstanding} - 本次结税后仍未收回的欠税总额
    message: "&6[税收] 本期统一结税完成，实收税额: &f{amount} &7剩余欠税: &f{outstanding}"
