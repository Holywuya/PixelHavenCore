version: 1

# =============================================================================
# 中心银行治理配置
# =============================================================================
# 功能说明：
#   - 实现中心银行 C/D 双账户治理系统
#   - 管理货币供给和流通量
#   - 支持活跃玩家统计和沉睡资产回收
#   - 提供宏观调控和动态扩缩容机制

# 功能开关（true = 启用，false = 禁用）
# 启用后，默认货币的 Vault 发放/扣费都会经由 C/D 账户路由
enabled: true

# 期望的"人均基础余额"
# 系统会基于活跃玩家数估算合理货币供给
expected-balance: 10000

# 供给缓冲倍数
# 最终理论供给 = expected-balance * buffer-multiplier * 活跃人数
# 用于应对短期波动和预留缓冲空间
buffer-multiplier: 2.0

# 活跃玩家判定天数
# 最近在此天数内有登录/经济活动记录的玩家，会被计入活跃样本
active-threshold-days: 14

# 沉睡资产判定天数
# 超过该天数未活跃的账户，可按 recovery-rate 周期性回收
dormant-threshold-days: 60

# 沉睡资产每周回收比例（范围: 0.0-1.0）
# 回收资金会直接回流中心银行 C 账户
# 例如: 0.01 表示每周回收 1% 的沉睡资产
dormant-recovery-rate: 0.01

# 宏观指标刷新间隔（单位：分钟）
# 用于更新活跃 M0、总余额、动态扩容等统计
sync-interval-minutes: 30

# 豁免账户列表
# 这些 UUID 不参与中心银行统计、活跃 M0 与税务治理
# 通常用于系统账户或特殊用途账户
exempt-account-ids: []

# 不活跃玩家阶梯权重
# 不活跃天数越高，计入货币供给计算的权重越低
# 用于更精确地估算实际货币流通量
inactivity-weights:
  # 14 天不活跃，权重 0.7
  - days: 14
    weight: 0.7
  # 30 天不活跃，权重 0.3
  - days: 30
    weight: 0.3
  # 60 天不活跃，权重 0.1
  - days: 60
    weight: 0.1

# C 账户最大负余额阈值
# 当补偿导致 C 账户余额低于此值时暂停补偿并记录警告
# 设为 -1 表示无限制
max-negative-reserve: -1

# 货币供给模式
# FIXED   — C 账户余额为硬上限，不自动扩缩
# MANAGED — 根据理论供给自动扩缩（推荐）
supply-mode: MANAGED

# MANAGED 模式下是否允许自动缩容
# 设为 false 则供给只能扩张（旧行为）
# 设为 true 则可以根据活跃玩家减少而收缩货币供给
allow-auto-contraction: true
