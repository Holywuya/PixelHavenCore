version: 1

# =============================================================================
# 玩家信息模块配置
# =============================================================================
# 功能说明：
#   - 提供玩家信息仪表盘查看功能
#   - 支持管理员查看其他玩家背包和末影箱
#   - 支持自定义界面标题

# 功能开关（true = 启用，false = 禁用）
enabled: true

# 界面标题配置
# 占位符:
#   {player} - 目标玩家名称
titles:
  # 玩家信息仪表盘标题
  dashboard: "&8玩家信息 - {player}"
  # 查看玩家背包时的界面标题
  inventory: "&8查看背包 - {player}"
  # 查看玩家末影箱时的界面标题
  enderChest: "&8查看末影箱 - {player}"
