version: 1

# =============================================================================
# 按键触发命令模块配置
# =============================================================================
# 功能说明：
#   - 将键盘按键绑定到命令执行
#   - 支持 F 键和 Shift+F 组合键
#   - 仅支持服务端可可靠捕获的按键
#   - 支持冷却时间防止频繁触发

# 总开关（true=启用，false=禁用）
enabled: true

# F 键绑定命令
# 未打开界面时按 F 执行
# 支持 {player} 占位符（替换为玩家名称）
f: "playerinv"

# Shift+F 键绑定命令
# 未打开界面时按 Shift + F 执行
# 支持 {player} 占位符（替换为玩家名称）
shiftF: "playerinv shared open public"

# 预留按键配置（服务端无法可靠识别 Ctrl / Alt）
# 设为空字符串 "" 表示不绑定
ctrlF: ""
altF: ""

# 触发冷却时间（单位：毫秒）
# 防止玩家在短时间内重复触发按键命令
# 默认 500 毫秒 = 0.5 秒
cooldownMillis: 500
