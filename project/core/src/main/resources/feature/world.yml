version: 2

# =============================================================================
# 世界管理模块配置
# =============================================================================
# 功能说明：
#   - 管理多世界传送和加载
#   - 支持设置默认世界和预加载世界
#   - 提供世界传送命令和消息配置

# 总开关（true=启用，false=禁用）
enabled: true

# 世界配置
worlds:
  # 默认世界名称（玩家首次进入或重生时的世界）
  default: spawn
  # 预加载世界列表（服务器启动时自动加载这些世界）
  preload:
    - spawn
  # 是否允许加载未在配置中列出的世界（true=允许，false=禁止）
  loadMissing: false
  # 是否允许传送到未在配置中列出的世界（true=允许，false=禁止）
  allowUnlistedTeleport: false

# 消息配置
# 支持 & 颜色代码和 MiniMessage 格式
messages:
  # 配置重载成功消息
  reloadSuccess: "&a世界模块配置已重载。"
  # 世界不存在或未加载时的错误消息
  # 占位符: {world} - 世界名称
  worldMissing: "&c世界未加载或未配置：&f{world}"
  # 自己传送到世界时的消息
  # 占位符: {world} - 世界名称
  teleportSelf: "&a已传送到世界 &f{world}"
  # 将其他玩家传送到世界时的消息
  # 占位符: {world} - 世界名称, {player} - 玩家名称
  teleportOther: "&a已将 &f{player} &a传送到世界 &f{world}"
  # 模块禁用时的提示消息
  moduleDisabled: "&c世界模块未启用。"
  # 目标玩家不在线时的提示消息
  playerOffline: "&c目标玩家不在线。"
