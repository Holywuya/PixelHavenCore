version: 1

# =============================================================================
# 连锁挖掘配置
# =============================================================================

# 功能开关（true = 启用，false = 禁用）
enabled: true

# 是否需要潜行触发
mustSneak: true

# 触发冷却（tick）
cooldown: 20

# 单次最大连锁数量
maxChain: 64

# 连锁搜索半径
searchRadius: 1

# 是否要求正确工具
needCorrectTool: true

# 是否需要 veinminer.use 权限
permissionRestricted: false

# 是否合并掉落物品
mergeItemDrops: false

# 是否消耗工具耐久
durabilityDecrease: true

# 可连锁的矿物列表（支持 * 通配符，如 *_ore。为空则不限制）
allowedBlocks:
  - "*_ore"
  - minecraft:ancient_debris

# 可连锁的树木原木/菌柄/木块/菌核（支持 * 通配符）
treeBlocks:
  - "*_log"
  - "*_wood"
  - "*_stem"
  - "*_hyphae"

# 允许触发的工具（支持 * 通配符，如 *_pickaxe。为空则不限制）
allowedTools:
  - "*_pickaxe"
  - "*_axe"

limit:
  enabled: true

  # 固定刷新小时
  resetHour: 0

  # 固定刷新分钟
  resetMinute: 0

# 消息配置
messages:
  limitCommand: "&a剩余连锁挖掘次数：&f{remaining} &7/ &f{limit}"
  limitDenied: "&c你没有剩余的连锁挖掘配额。"
  limitRemaining: "&7剩余次数：&f{remaining}"
  modeOn: "&a连锁挖掘已启用。剩余次数：&f{remaining}"
  modeOff: "&c连锁挖掘已禁用。"

# 权限组设置（按 priority 从高到低匹配）
groups:
  default:
    permission: ""
    priority: 0
    limit: 64
  vip:
    permission: "veinminer.group.vip"
    priority: 10
    limit: 128
