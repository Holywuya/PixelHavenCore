version: 1

# =============================================================================
# 安全检查模块配置
# =============================================================================
# 功能说明：
#   - 提供管理员查看玩家背包和末影箱的功能
#   - 用于反作弊和物品调查
#   - 支持自定义界面标题

# 总开关（true=启用，false=禁用）
enabled: true

# 界面标题配置
# 占位符:
#   {player} - 被查看的玩家名称
titles:
  # 查看玩家背包时的界面标题
  inventory: "&8查看背包 - {player}"
  # 查看玩家末影箱时的界面标题
  enderChest: "&8查看末影箱 - {player}"
