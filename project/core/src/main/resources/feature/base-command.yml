version: 9

# =============================================================================
# 基础命令模块配置
# =============================================================================
# 功能说明：
#   - 提供基础游戏命令和保护功能
#   - 包含自杀命令、苦力怕防爆、传送门保护等
#   - 支持自定义消息和权限控制

# 总开关（true=启用，false=禁用）
enabled: true

# 消息配置
messages:
  # 自杀命令执行后的提示消息
  suicide: "&c你已自杀。"

# 苦力怕防爆配置
creeperProtect:
  # 是否启用苦力怕防爆（true=启用，false=禁用）
  enabled: false
  # 防爆模式
  # true=完全取消爆炸（无伤害无破坏）
  # false=仅保护方块不受破坏（爆炸伤害保留）
  cancelDamage: false

# 传送门保护配置
portalProtection:
  # 是否禁止指定生物进入传送门（true=启用，false=禁用）
  enabled: true
  # 禁止进入传送门的生物类型列表
  blockedEntities:
    - "FROG"
  # 若指定生物出现在地狱或末地，是否直接清除（true=清除，false=不清除）
  clearInNetherEnd: true
  # 在地狱/末地自动清除的生物类型列表
  clearEntitiesInNetherEnd:
    - "FROG"
