version: 9

# =============================================================================
# 基础命令模块配置
# =============================================================================
# 功能说明：
#   - 提供基础游戏命令和保护功能
#   - 包含自杀命令、苦力怕防爆、传送门保护等
#   - 支持自定义消息和权限控制

# 总开关（true=启用，false=禁用）
enabled: true

# 消息配置
messages:
  # 自杀命令执行后的提示消息
  suicide: "&c你已自杀。"
  # 模块禁用时提示消息
  moduleDisabled: "&c基础模块已禁用。"

# /back 命令配置
back:
  # 是否启用 /back 命令
  enabled: true
  # 传送预热等待时间（秒），0=无预热
  warmupSeconds: 3
  # 预热期间移动是否取消传送
  cancelOnMove: true
  # 预热期间受伤是否取消传送
  cancelOnDamage: true
  # true=跳过安全位置检测，直接传送到原始坐标
  unsafeTeleport: false
  # 消息配置
  msgNoLocation: "&c没有可返回的位置。"
  msgWarmupStarting: "&a将在 {time} 秒后传送... 请勿移动"
  msgWarmupCancelled: "&c传送已取消！"
  msgTeleported: "&a已传送到死亡位置。"
  msgAlreadyWarmingUp: "&c传送预热中，请稍候。"
  msgDeathButton: "&c你已死亡！ &a[点击此处返回死亡位置]"
  msgDeathHover: "&a点击回到死亡点"

# 苦力怕防爆配置
creeperProtect:
  # 是否启用苦力怕防爆（true=启用，false=禁用）
  enabled: false
  # 防爆模式
  # true=完全取消爆炸（无伤害无破坏）
  # false=仅保护方块不受破坏（爆炸伤害保留）
  cancelDamage: false

# 传送门保护配置
portalProtection:
  # 是否禁止指定生物进入传送门（true=启用，false=禁用）
  enabled: true
  # 禁止进入传送门的生物类型列表
  blockedEntities:
    - "FROG"
  # 若指定生物出现在地狱或末地，是否直接清除（true=清除，false=不清除）
  clearInNetherEnd: true
  # 在地狱/末地自动清除的生物类型列表
  clearEntitiesInNetherEnd:
    - "FROG"

# 首次登录随机传送配置
first-join:
  # 总开关
  enabled: true
  # 传送中心坐标（相对于世界出生点 0,0 的偏移）
  centerX: 0
  centerZ: 0
  # 最小半径（距中心至少多远，防止传送到出生点附近）
  minRadius: 5000
  # 最大半径（距中心至多多远）
  maxRadius: 500000
  # 安全位置查找最大尝试次数
  safeLocationRetries: 10
  # 传送成功提示（{x}{y}{z} 为占位符）
  msgTeleported: "&a你被随机传送到 {x}, {y}, {z}"
