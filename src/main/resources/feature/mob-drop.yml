version: 6

enabled: true

# 抢夺附魔等级对自定义掉落概率的乘数（乘算，不是加算）
# 实际概率 = 基础概率 * 对应等级乘数（最终封顶 1.0）
looting-multiplier-by-level:
  0: 1.0
  1: 1.25
  2: 1.5
  3: 1.8

# 格式：
# drops:
#   <EntityType>:
#     clearVanillaDrops: true/false   # 是否清除该怪物原版掉落（默认 false）
#     money:
#       - "<chanceExpr> <minExpr> <maxExpr> <mode> [radius] [split]"
#     items:
#       - "<spec> <amountExpr> <chanceExpr>"
#   <MythicMobId>:
#     clearVanillaDrops: true/false   # 若实体是该 MM 怪物，则优先使用这条配置
#     items:
#       - "<spec> <amountExpr> <chanceExpr>"
#
# 表达式支持：+ - * / () 和 {level} 占位符。
# MythicMobs 会把 {level} 替换成该怪物等级；普通怪物默认 level=1。
#
# spec 支持：
#   - bai:xxx            (Baikiruto 物品 ID，旧 ni:xxx 也兼容)
#   - ce:namespace:id    (CraftEngine 物品 ID，省略命名空间时默认 craftengine)
#   - head:PlayerName    (玩家头颅 / UUID / Base64)
#   - DIAMOND         (原版 Material 名称)
drops:
  ZOMBIE:
    clearVanillaDrops: false
    money:
      - "1.0 5 15 killer"
    items:
      - "bai:example_item 1 0.5"
      - "head:Notch 1 0.1"
  SKELETON:
    clearVanillaDrops: true
    items:
      - "BONE 1+{level} 0.2+0.2*{level}"

  ExampleBoss:
    clearVanillaDrops: true
    money:
      - "1.0 300+100*{level} 600+100*{level} nearby 12 true"
    items:
      - "bai:example_item 1+{level} 0.6+0.05*{level}"
