暴力机甲随机生成:
  # 单配置开关。
  Enable: false

  # MythicMobs 内部怪物 ID。
  Type: 暴力机甲

  # 支持单等级，或使用列表写权重。
  # Level: 1
  Level:
    - 1 0.1 # 10% 概率生成 1 级
    - 2 0.2 # 20% 概率生成 2 级
    - 3 0.7 # 70% 概率生成 3 级

  # 每个周期触发概率，范围 0.0 ~ 1.0。
  Chance: 1

  # 间隔秒数，内部会自动换算为 tick。
  Interval: 20

  # 每次触发生成数量。
  SpawnAmount: 1

  # 生成半径，同时作为延迟清理的判定距离。
  Distance: 24

  # 在 2 * Distance 范围内，此刷怪器生成实体的最大数量。
  MaxAmount: 3

  # 延迟多少 tick 后开始执行距离清理。
  Delay: 600

  # 数值越大，加载与执行排序越靠前。
  Priority: 505

  # 生效世界，留空表示所有世界。
  Worlds:
    - world
    - world_nether
    - world_the_end

  # 是否交给原版远距离清理。
  RemoveWhenFarAway: true
