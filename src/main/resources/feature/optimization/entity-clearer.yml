version: 6

# 总开关
enabled: true

# =============================================================================
# 实体清理模块配置
# =============================================================================

# 全量清理周期（秒）
# 20 分钟 = 1200 秒
scan-interval-seconds: 1200

# 倒计时提示秒数（ACTIONBAR）
countdown-seconds:
  - 10
  - 5

# 倒计时提示消息
countdown-message: "&e[实体清理] &7将在 &f{seconds} &7秒后执行清理。"

# 清理完成汇总消息
cycle-summary-message: "&a[实体清理] &7本轮清理完成，共清理 &f{count} &7个实体。"

items:
  enabled: true

mobs:
  enabled: true
