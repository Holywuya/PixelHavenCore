enabled: true

tick-interval-seconds: 2

season:
  duration-ticks: 12096000
  transition-progress: 0.1

weather:
  decision-interval-seconds: 300
  persistence-chance: 0.6
  extreme:
    # 命中 BLIZZARD / SANDSTORM / ACID_RAIN 时，先进入预警倒计时；<= 0 则直接切换。
    warning-seconds: 30
    grace-period-seconds: 10
    damage-interval-seconds: 3
    base-damage-hearts: 2.0
  visibility:
    # 视觉效果使用短持续药水并自动续期，避免主动清除其他系统来源效果。
    effect-duration-seconds: 3
    fog:
      blindness-amplifier: 0
    blizzard:
      blindness-amplifier: 1
    sandstorm:
      blindness-amplifier: 2

temperature:
  comfort-min: 15
  comfort-max: 36
  altitude-threshold-y: 80
  altitude-drop-per-block: 0.5
  scan-interval-seconds: 5
  max-change-per-tick: 0.5
  shelter:
    # 室内/保温遮蔽仍使用偏宽松判定；以下开关主要影响天气暴露判定。
    # 天气遮蔽默认接受完整实体顶、半砖顶、楼梯顶；玻璃/树叶由下列开关决定。
    glass-counts-as-shelter: false
    leaves-count-as-shelter: false
    horizontal-radius: 1
  armor-bonus:
    leather: 5
    netherite: 10
  thresholds:
    severe-heat: 42.0
    heat: 36.0
    cold-mild: 15.0
    cold: 5.0
    severe-cold: -5.0

thirst:
  base-rate-per-minute: 0.5
  sprint-multiplier: 2.0
  submerge-multiplier: 0.1
  altitude-threshold-y: 100
  altitude-multiplier: 1.2
  temperature-deviation-percent-per-degree: 2.0
  thresholds:
    full: 60.0
    thirsty: 30.0
    severe: 10.0
  water-sources:
    water-bottle: 30.0
    right-click-source: 20.0
    drinker: 40.0
    rain-per-minute: 2.0
    sea-water: 10.0
  drinker-cooldown-seconds: 2
  water-quality:
    river-nausea-chance: 0.1
    sea-water-nausea-chance: 1.0

hud:
  actionbar-format: "&c🌡 {temp}°C  &b💧 {hydration}/100  &f{weather}  &a{season}"
  refresh-interval-seconds: 2
  bossbar-enabled: true
  bossbar-title-heat: "&c严重过热！寻找阴凉处！"
  bossbar-title-cold: "&b严重过冷！寻找热源！"
  bossbar-title-thirst: "&e严重脱水！寻找水源！"

storage:
  auto-save-interval-minutes: 5
